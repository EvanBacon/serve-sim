name: Build serve-sim for CI
description: Restore SwiftPM .build, arm64-or-universal native build, overlap iOS sim boot, optionally probe cache restore.
inputs:
  arch:
    description: SERVE_SIM_ARCH (arm64 for tests, universal for npm publish builds)
    required: false
    default: arm64
  boot-simulator:
    description: Start iOS simulator boot in the background and wait after the build
    required: false
    default: "true"
  probe-cache:
    description: On cache miss, tar-roundtrip .build and rebuild to verify a warm hit
    required: false
    default: "true"
outputs:
  udid:
    description: Booted simulator UDID (empty if boot-simulator is false)
    value: ${{ steps.wait-sim.outputs.udid }}
  cache-hit:
    description: Exact SwiftPM cache key hit
    value: ${{ steps.swiftpm-restore.outputs.cache-hit }}
  cache-key:
    description: SwiftPM cache key used for restore/save
    value: ${{ steps.toolchain.outputs.cache-key }}
  build-seconds:
    description: Wall time of bun run build.ts
    value: ${{ steps.build.outputs.elapsed }}
  probe-warm:
    description: true if the cache-miss restore probe rebuilt within the warm budget
    value: ${{ steps.probe.outputs.warm }}
  probe-seconds:
    description: Restore-rebuild seconds from the cache probe (empty on cache hit)
    value: ${{ steps.probe.outputs.rebuild_seconds }}
  probe-verdict:
    description: WARM_HIT, NO_SPEEDUP, BROKEN, or skipped
    value: ${{ steps.probe.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Start iOS simulator boot
      if: inputs.boot-simulator == 'true'
      shell: bash
      run: |
        STATE_DIR="${SERVE_SIM_BOOT_DIR:-/tmp/serve-sim-boot}"
        mkdir -p "$STATE_DIR"
        nohup "${GITHUB_ACTION_PATH}/../../scripts/boot-ios-simulator.sh" \
          >"$STATE_DIR/log" 2>&1 &
        echo $! > "$STATE_DIR/pid"
        echo "Simulator boot started (pid $(cat "$STATE_DIR/pid"))"

    - name: Record Swift/Xcode identity
      id: toolchain
      shell: bash
      run: |
        SWIFT=$(swift --version 2>&1 | tr '\n' ' ' | tr -s ' ')
        XCODE=$(xcodebuild -version 2>&1 | tr '\n' ' ' | tr -s ' ')
        echo "swift: $SWIFT"
        echo "xcode: $XCODE"
        TOOLCHAIN_ID=$(printf '%s\n%s\n' "$SWIFT" "$XCODE" | shasum -a 256 | awk '{print $1}')
        echo "toolchain_id=$TOOLCHAIN_ID" >> "$GITHUB_OUTPUT"
        # hashFiles is workspace-relative; Sources + Package.swift + lockfiles
        # are the SwiftPM inputs. Arch is part of the key because arm64 vs
        # universal layout .build differently.
        FILES_HASH="${{ hashFiles('packages/serve-sim/Package.swift', 'packages/serve-sim/Sources/SimNative/**', 'packages/serve-sim/Sources/SimNativeSupport/**', 'packages/serve-sim/Tests/SimNativeSupportTests/**', 'bun.lock', 'packages/serve-sim/package.json') }}"
        KEY="${{ runner.os }}-swiftpm-${{ inputs.arch }}-${TOOLCHAIN_ID}-${FILES_HASH}"
        echo "cache-key=$KEY" >> "$GITHUB_OUTPUT"
        echo "SwiftPM cache key: $KEY"

    - name: Restore SwiftPM .build
      id: swiftpm-restore
      uses: actions/cache/restore@v4
      with:
        path: packages/serve-sim/.build
        key: ${{ steps.toolchain.outputs.cache-key }}
        restore-keys: |
          ${{ runner.os }}-swiftpm-${{ inputs.arch }}-${{ steps.toolchain.outputs.toolchain_id }}-

    - name: Build serve-sim
      id: build
      working-directory: packages/serve-sim
      shell: bash
      env:
        SERVE_SIM_ARCH: ${{ inputs.arch }}
      run: |
        START=$(date +%s)
        bun run build.ts
        END=$(date +%s)
        ELAPSED=$((END - START))
        echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
        HIT="${{ steps.swiftpm-restore.outputs.cache-hit }}"
        echo "Build elapsed ${ELAPSED}s (cache-hit=${HIT:-false}, SERVE_SIM_ARCH=$SERVE_SIM_ARCH)"
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            echo "### serve-sim CI build"
            echo ""
            echo "- \`bun run build.ts\`: **${ELAPSED}s**"
            echo "- SwiftPM cache-hit: \`${HIT:-false}\`"
            echo "- SERVE_SIM_ARCH: \`$SERVE_SIM_ARCH\`"
            echo "- cache key: \`${{ steps.toolchain.outputs.cache-key }}\`"
            echo ""
            echo "How to verify the cache: a miss plus \`.github/scripts/probe-swiftpm-cache.sh\` must rebuild in seconds/low tens, not ~200s. A later job with cache-hit=true should land in the same band. If either is still a cold SwiftPM compile, remove the cache — Apple incremental state is not worth a decorative restore."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [[ "$HIT" == "true" && "$ELAPSED" -gt 60 ]]; then
          echo "::warning title=SwiftPM cache hit was not warm::cache-hit=true but build took ${ELAPSED}s (expected seconds/low tens). Treat this cache as ineffective."
        fi

    - name: Probe SwiftPM .build restore
      id: probe
      if: inputs.probe-cache == 'true' && steps.swiftpm-restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        SERVE_SIM_ARCH: ${{ inputs.arch }}
      run: bash "${GITHUB_ACTION_PATH}/../../scripts/probe-swiftpm-cache.sh"

    - name: Save SwiftPM .build
      if: >-
        always() &&
        steps.build.outcome == 'success' &&
        steps.swiftpm-restore.outputs.cache-hit != 'true' &&
        (inputs.probe-cache != 'true' || steps.probe.outputs.warm == 'true')
      uses: actions/cache/save@v4
      with:
        path: packages/serve-sim/.build
        key: ${{ steps.toolchain.outputs.cache-key }}

    - name: Wait for iOS simulator
      id: wait-sim
      if: inputs.boot-simulator == 'true'
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../../scripts/wait-ios-simulator.sh"
