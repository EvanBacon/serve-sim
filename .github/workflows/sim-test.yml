name: serve-sim tests

on:
  pull_request:
    paths:
      # Darwin e2e is for native/sim/helper coverage. Client-only and unit-test
      # diffs run on Ubuntu via serve-sim-unit.yml instead of occupying a Mac.
      - "packages/serve-sim/Sources/**"
      - "packages/serve-sim/Tests/**"
      - "packages/serve-sim/Package.swift"
      - "packages/serve-sim/Package.resolved"
      - "packages/serve-sim/build.ts"
      - "packages/serve-sim/package.json"
      - "packages/serve-sim/scripts/**"
      - "packages/serve-sim/src/*.ts"
      - "bun.lock"
      - ".github/workflows/sim-test.yml"
      - ".github/scripts/**"
      - ".github/actions/**"
      - "packages/serve-sim/src/__tests__/accessibility-endpoint.test.ts"
      - "packages/serve-sim/src/__tests__/avcc-stream-endpoint.test.ts"
      - "packages/serve-sim/src/__tests__/camera-connections.e2e.test.ts"
      - "packages/serve-sim/src/__tests__/hid-malformed-input.test.ts"
      - "packages/serve-sim/src/__tests__/idle-floor.test.ts"
      - "packages/serve-sim/src/__tests__/permissions.e2e.test.ts"
      - "packages/serve-sim/src/__tests__/type-command-sim.test.ts"
      - "packages/serve-sim/src/__tests__/ui-settings.e2e.test.ts"
      - "packages/serve-sim/src/__tests__/shm-probe.integration.test.ts"

# Cancel superseded runs — pushing twice to the same PR shouldn't burn two
# macOS slots in parallel.
concurrency:
  group: sim-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-test:
    runs-on: macos-26
    # 25 (not 15) leaves headroom for per-file e2e retry: a malformed-HID frame
    # or mid-stream native crash can wedge the shared simulator. Reboot-and-retry
    # that file once; a real regression still fails both attempts.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      # Boot overlaps `bun run build.ts`. SwiftPM `.build` is not cached:
      # CI hits were 58s then 292s (ineffective / slower than cold).
      - name: Build serve-sim (arm64) and boot simulator
        id: ci-build
        uses: ./.github/actions/build-serve-sim-for-ci
        with:
          arch: arm64

      - name: serve-sim Darwin tests
        env:
          UDID: ${{ steps.ci-build.outputs.udid }}
        run: bun packages/serve-sim/scripts/run-sim-e2e.ts

      - name: Shutdown simulator
        if: always() && steps.ci-build.outputs.udid != ''
        run: xcrun simctl shutdown "${{ steps.ci-build.outputs.udid }}" || true
