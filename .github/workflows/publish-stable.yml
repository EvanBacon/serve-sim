name: Publish stable to npm

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-stable:
    if: github.repository == 'EvanBacon/serve-sim' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Stable publishes must run from main."
            exit 1
          fi

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin via .bun-version: resolving "latest" hits GitHub's
          # git/refs/tags API, which 503s during GitHub incidents.
          bun-version-file: .bun-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Test-phase build is arm64-only; boot overlaps it. The publish step below
      # rebuilds without SERVE_SIM_ARCH so the npm tarball stays universal.
      - name: Build serve-sim (arm64) and boot simulator
        id: ci-build
        uses: ./.github/actions/build-serve-sim-for-ci
        with:
          arch: arm64

      - name: serve-sim Darwin tests
        env:
          UDID: ${{ steps.ci-build.outputs.udid }}
          # Camera e2e clang uses parseServeSimArch(); default is universal (fat).
          SERVE_SIM_ARCH: arm64
        run: bun packages/serve-sim/scripts/run-sim-e2e.ts

      - name: Shutdown simulator
        if: always() && steps.ci-build.outputs.udid != ''
        run: |
          xcrun simctl shutdown "${{ steps.ci-build.outputs.udid }}" || true

      - name: Build and publish serve-sim stable
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/serve-sim

          # package.json holds the exact stable version to publish. No hidden
          # bump from max(local, npm). If that version is already on npm, skip
          # publish so a rerun can still tag and bump. The script fails if
          # package.json is behind npm latest.
          PLAN=$(node scripts/publish-version.mjs stable)
          ACTION=${PLAN%% *}
          VERSION=${PLAN#* }
          echo "action=$ACTION version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$ACTION" = "publish" ]; then
            bun run build
            npm publish --access public --tag latest --provenance
          elif [ "$ACTION" = "skip" ]; then
            echo "serve-sim@$VERSION already on npm; skipping publish (idempotent rerun)"
          else
            echo "::error::Unexpected stable plan: $ACTION $VERSION"
            exit 1
          fi

      - name: Tag release and bump package.json to the next patch
        run: |
          VERSION="${{ steps.publish.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version from the publish step."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            git fetch origin tag "$TAG" --no-tags
            TAGGED=$(git rev-list -n 1 "$TAG")
            HEAD=$(git rev-parse HEAD)
            if [ "$TAGGED" != "$HEAD" ]; then
              echo "::error::$TAG already points at $TAGGED, not $HEAD. Refusing to move the tag."
              exit 1
            fi
            echo "$TAG already points at HEAD"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          NEXT=$(node packages/serve-sim/scripts/publish-version.mjs next-patch)
          CURRENT=$(node -p "require('./packages/serve-sim/package.json').version")
          if [ "$CURRENT" = "$NEXT" ]; then
            echo "package.json already at $NEXT"
          elif [ "$CURRENT" != "$VERSION" ]; then
            echo "::error::package.json is $CURRENT; expected $VERSION (the version just released) or $NEXT."
            exit 1
          else
            node packages/serve-sim/scripts/publish-version.mjs set "$NEXT"
            git add packages/serve-sim/package.json
            git commit -m "chore: bump serve-sim to $NEXT [skip ci]"
            if ! git push origin HEAD:main; then
              echo "::error::Published serve-sim@$VERSION and tagged $TAG, but could not push the $NEXT bump to main (branch protection may be blocking github-actions[bot]). Allow the bot to push version-bump commits, or merge a package.json bump to $NEXT before the next release. Refusing to leave package.json silently behind npm."
              exit 1
            fi
          fi
