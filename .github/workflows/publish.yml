name: Publish beta to npm

on:
  push:
    branches: [main]
    paths:
      - "packages/serve-sim/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-beta:
    if: github.repository == 'EvanBacon/serve-sim' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    concurrency:
      group: serve-sim-publish-beta
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect serve-sim changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sim=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Publish beta if serve-sim source changed. A package.json-only
          # bump (the post-stable version PR) must not cut a new beta.
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          SOURCE_CHANGED=false
          if echo "$CHANGED" | grep -Eq "^packages/serve-sim/" && \
             echo "$CHANGED" | grep -Ev "^packages/serve-sim/package.json$" | grep -q .; then
            SOURCE_CHANGED=true
          fi

          if [ "$SOURCE_CHANGED" = "true" ]; then
            echo "sim=true" >> $GITHUB_OUTPUT
          else
            echo "sim=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup bun
        if: steps.changes.outputs.sim == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node.js
        if: steps.changes.outputs.sim == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.changes.outputs.sim == 'true'
        run: bun install --frozen-lockfile

      # Test-phase build is arm64-only; boot overlaps it. The publish step below
      # rebuilds without SERVE_SIM_ARCH so the npm tarball stays universal.
      - name: Build serve-sim (arm64) and boot simulator
        if: steps.changes.outputs.sim == 'true'
        id: ci-build
        uses: ./.github/actions/build-serve-sim-for-ci
        with:
          arch: arm64

      - name: serve-sim Darwin tests
        if: steps.changes.outputs.sim == 'true'
        env:
          UDID: ${{ steps.ci-build.outputs.udid }}
          # Camera e2e clang uses parseServeSimArch(); default is universal (fat).
          SERVE_SIM_ARCH: arm64
        run: bun packages/serve-sim/scripts/run-sim-e2e.ts

      - name: Shutdown simulator
        if: always() && steps.ci-build.outputs.udid != ''
        run: |
          xcrun simctl shutdown "${{ steps.ci-build.outputs.udid }}" || true

      - name: Build and publish serve-sim beta
        if: steps.changes.outputs.sim == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/serve-sim

          # package.json holds the next stable version. Each main publish is
          # <that version>-beta.N, where N is one above the highest N already
          # on npm. Legacy <version>-beta.N.M counts as N, so the next number
          # sorts above those. Reruns recompute and cannot collide. The script
          # fails if package.json is not ahead of npm's latest tag.
          VERSION=$(node scripts/publish-version.mjs beta)
          echo "Publishing serve-sim@$VERSION"
          node scripts/publish-version.mjs set "$VERSION"

          bun run build

          npm publish --access public --tag beta --provenance
